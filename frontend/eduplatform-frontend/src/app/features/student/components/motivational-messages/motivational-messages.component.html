<!-- Motivational Messages Component -->
<div class="motivational-messages-container" *ngIf="showMotivationalMessages">
  <div
    class="motivational-message-card"
    [@messageAnimation]="currentMessageIndex"
  >
    <div class="message-icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"
        ></path>
      </svg>
    </div>

    <div class="message-content">
      <p class="message-text">{{ currentMessage }}</p>
      <div class="message-progress">
        <div class="progress-bar" [style.width.%]="progressWidth"></div>
      </div>
    </div>

    <button
      class="close-message-btn"
      (click)="hideMessages()"
      aria-label="Cerrar mensaje"
    >
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <line x1="18" y1="6" x2="6" y2="18"></line>
        <line x1="6" y1="6" x2="18" y2="18"></line>
      </svg>
    </button>
  </div>
</div>
