<!-- Loading -->
<div *ngIf="isLoading" class="whatsapp-compact loading">
  <div class="spinner"></div>
  <span>Cargando...</span>
</div>

<!-- Con enlace configurado - VERSIÓN COMPACTA -->
<button
  *ngIf="!isLoading && hasLink"
  class="whatsapp-compact active"
  (click)="openWhatsapp()"
>
  <div class="whatsapp-icon">
    <svg
      width="20"
      height="20"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
    >
      <path
        d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"
      ></path>
    </svg>
  </div>
  <div class="whatsapp-text">
    <span class="whatsapp-label">Grupo de WhatsApp</span>
    <span class="whatsapp-hint">Haz clic para unirte</span>
  </div>
  <svg
    class="whatsapp-arrow"
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <polyline points="9 18 15 12 9 6"></polyline>
  </svg>
</button>

<!-- Sin enlace configurado - VERSIÓN COMPACTA -->
<div *ngIf="!isLoading && !hasLink" class="whatsapp-compact disabled">
  <svg
    width="18"
    height="18"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
  >
    <circle cx="12" cy="12" r="10"></circle>
    <line x1="12" y1="8" x2="12" y2="12"></line>
    <line x1="12" y1="16" x2="12.01" y2="16"></line>
  </svg>
  <span>Sin grupo de WhatsApp configurado</span>
</div>
