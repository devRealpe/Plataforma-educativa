spring.application.name=plataforma-educativa-angular

# PostgreSQL Configuration
spring.datasource.url=jdbc:postgresql://172.16.10.200:5433/eduplatform
spring.datasource.username=postgres
spring.datasource.password=User*2018
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# CONFIGURACIÓN CRÍTICA PARA BYTEA
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.type.preferred_uuid_jdbc_type=VARCHAR

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
file.upload-dir=uploads

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.com.unimar.plataforma_educativa_angular=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE